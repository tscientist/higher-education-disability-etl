version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: higher-education-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: higher_education
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etl-network

  python-etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: higher-education-etl
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_CREDENTIALS_PATH: /app/credentials.json
      MONGO_URI: mongodb://admin:password@mongodb:27017
      MONGO_DATABASE: higher_education
      MONGO_COLLECTION: students
      BIGQUERY_DATASET: ${BIGQUERY_DATASET}
      BIGQUERY_TABLE: ${BIGQUERY_TABLE}
    volumes:
      - .:/app
      - ./credentials.json:/app/credentials.json:ro
    networks:
      - etl-network
    command: python main.py

volumes:
  mongo_data:

networks:
  etl-network:
    driver: bridge